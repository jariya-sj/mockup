{% extends "core/base.html" %}
{% block title %}{{ title }} | DEK INTERN{% endblock %}
{% block content %}<section class="mx-auto max-w-6xl px-6 py-10"><div class="mb-7"><span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-bold uppercase text-blue-700">{{ role }}</span><h1 class="mt-3 text-3xl font-black">{{ title }}</h1><p class="mt-2 text-slate-500">{{ description }}</p></div><div class="grid gap-4 md:grid-cols-3"><div class="rounded-xl bg-blue-800 p-5 text-white"><p class="text-sm text-blue-100">ประกาศงานที่เกี่ยวข้อง</p><strong class="mt-2 block text-3xl">{{ jobs|length }}</strong></div><div class="rounded-xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">รายการที่ต้องติดตาม</p><strong class="mt-2 block text-3xl">0</strong></div><div class="rounded-xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">สถานะบัญชี</p><strong class="mt-2 block text-lg text-emerald-600">พร้อมใช้งาน</strong></div></div><div class="mt-8 rounded-xl border border-slate-200 bg-white p-6"><h2 class="text-lg font-extrabold">ทางลัด</h2><div class="mt-4 flex flex-wrap gap-3"><a href="{% url 'core:home' %}" class="rounded-lg bg-blue-50 px-4 py-2 text-sm font-bold text-blue-700">ดูประกาศงาน</a><button data-toast="ฟังก์ชันนี้จะเชื่อมต่อฐานข้อมูลในขั้นถัดไป" class="rounded-lg bg-slate-100 px-4 py-2 text-sm font-bold text-slate-700">จัดการข้อมูล</button></div></div></section>{% endblock %}
